services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ratecore-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - RCORE_HTTP_PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: ratecore-bot
    depends_on:
      - api
    env_file:
      - .env
    environment:
      - RCORE_API_BASE_URL=http://api:8080
    restart: unless-stopped

networks:
  default:
    driver: bridge
