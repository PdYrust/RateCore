[tool.poetry]
name = "ratecore-bot"
version = "0.1.0"
description = "Telegram bot frontend for RateCore price service"
authors = ["RateCore Team <dev@ratecore.local>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
aiogram = "3.11.0"
aiohttp = "3.10.8"
pydantic = "2.8.2"
pydantic-settings = "2.2.1"
aiohttp-socks = "^0.9.1"
python-dotenv = "^1.0.1"
SQLAlchemy = "^2.0.30"
aiosqlite = "^0.20.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
